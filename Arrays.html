<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArrayMethods</title>
</head>
<body>
    <script>
        //Array Creation
        let languages=["java","python","node.js"];

        //Array Methods
        //1.push()
        let flowers=["rose","jasmine","sunflower"];
        flowers.push("Tulip");
        console.log(flowers);

        //2.pop()
        flowers.pop();
        console.log(flowers);

        //3.unshift()
        flowers.unshift("Mariegold");
        console.log(flowers);

        //4.shift()
        flowers.shift();
        console.log(flowers);

        //5.length
        console.log(flowers.length);

        //6.indexOf()
        let index=flowers.indexOf("jasmine");
        console.log(index);

        //7.includes()
        console.log(flowers.includes("Mariegold"));

        //8.slice()
        let numbers=[1,2,3,4,5];
        let s=flowers.slice(1,3);
        console.log(s);

        //9.splice()
        numbers.splice(1,3,88);
        console.log(numbers);

        //10.sort()
        let colors=["orange","pink","red","yellow","blue"];
        colors.sort();
        console.log(colors);

        //11.map()
        let n=[1,2,3].map(x=>x*2);
        console.log(n);

        //12.filter()
        let evenNum=[1,2,3,4,5].filter(x=>x%2==0);
        console.log(evenNum);

    </script>
</body>
</html>

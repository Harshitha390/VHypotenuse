<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops</title>
</head>
<body>
    <script>
        //for loop
        for(let i=0;i<=3;i++){
            console.log(i);
        }

        //for-in Loop
        let employee={eid:11, ename:"Anusha",age:24,salary:30000};
        for(let key in employee){
            console.log(key);
        }

        //for-of Loop
        let colors=["red","blue","yellow"];
        for(let color in colors){
            console.log(color);
        }

        //while loop
        let i=1;
        while(i<=3){
            console.log(i);
            i++;
        }

        //do while loop
        let j=1;
        do{
            console.log(j);
            j++;
        }
        while(j<=2);

        //break statement
        for(let k=1; k<=5; k++){
            console.log(k);
            if(k==3){
                break;          //come out of the loop
            }
        }

        //continue statement
        for(let k=1; k<=5; k++){
            if(k==3){
                continue;        //skip the current iteration and proceed to next iterations
            }
            console.log(k);
        }
    </script>
</body>
</html>
